name: App Store review submission

on:
  workflow_dispatch:
    inputs:
      version:
        description: App Store marketing version (0.1.0)
        required: true
        type: string
      confirm_submit:
        description: Type SUBMIT_APP_REVIEW to submit the exact candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: app-store-connect-mutation-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  authorize:
    name: Approve App Review submission
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.version == '0.1.0' &&
      inputs.confirm_submit == 'SUBMIT_APP_REVIEW'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: app-store

    steps:
      - name: Record exact submission approval
        run: |
          echo "App Review submission approved for build 33770597608.1."
          echo "The version remains configured for manual release."
          echo "No public release, tag, or GitHub release is authorized."

  submit:
    name: Submit exact App Store candidate
    needs: authorize
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.version == '0.1.0' &&
      inputs.confirm_submit == 'SUBMIT_APP_REVIEW' &&
      needs.authorize.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 30
    environment:
      name: testflight
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_BUILD_NUMBER: 33770597608.1

    steps:
      - name: Check out submission tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out exact candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: cab65511405f5c6b17865d2283d4a636a59da8be
          path: candidate-source
          persist-credentials: false

      - name: Install pinned Windows production tools
        shell: powershell
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass
          -File .\candidate-source\scripts\setup-windows.ps1

      - name: Regenerate exact candidate screenshots
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File .\scripts\generate-app-store-screenshots.ps1 `
            -ProjectDirectory .\candidate-source `
            -OutputDirectory "$env:RUNNER_TEMP\app-store-screenshots"

      - name: Submit candidate to App Review
        shell: powershell
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          APP_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.APP_REVIEW_CONTACT_FIRST_NAME }}
          APP_REVIEW_CONTACT_LAST_NAME: ${{ secrets.APP_REVIEW_CONTACT_LAST_NAME }}
          APP_REVIEW_CONTACT_EMAIL: ${{ secrets.APP_REVIEW_CONTACT_EMAIL }}
          APP_REVIEW_CONTACT_PHONE: ${{ secrets.APP_REVIEW_CONTACT_PHONE }}
          APP_STORE_SCREENSHOT_PACKAGE: ${{ runner.temp }}\app-store-screenshots\release-package.json
          APP_STORE_SCREENSHOT_DIRECTORY: ${{ runner.temp }}\app-store-screenshots\ipad-13-inch
        run: node scripts/submit-app-store-review.mjs

      - name: Remove generated submission files
        if: always()
        shell: powershell
        run: |
          $path = Join-Path $env:RUNNER_TEMP "app-store-screenshots"
          if (Test-Path -LiteralPath $path) {
            Remove-Item -LiteralPath $path -Recurse -Force
          }
          if (Test-Path -LiteralPath $path) {
            throw "Generated App Store screenshot files remain after cleanup."
          }
