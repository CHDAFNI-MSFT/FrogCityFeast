name: iOS unsigned smoke build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-build:
    name: Export and compile without signing
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: "0000000000"
      IOS_BUNDLE_ID: com.example.samuelicecream
      IOS_SHORT_VERSION: 0.0.0
      IOS_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select pinned Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Cache pinned Godot downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/downloads/Godot_v4.7.2-stable_macos.universal.zip
            .tools/downloads/Godot_v4.7.2-stable_export_templates.tpz
          key: godot-macos-4.7.2-38aa16e5bba2083941fc5b3e54be0089bd4cc35e32415f5b9fd9a8a6a7b9818255d44532ea8ef94b5aef56c4b407c2d634fa4f657e4ebe681ebbf59b7bac69ca-ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079

      - name: Install Godot and export templates
        run: >
          bash scripts/setup-unix.sh
          --skip-system-tools
          --install-export-templates

      - name: Run iOS preflight
        run: bash scripts/ios-preflight.sh smoke

      - name: Export Xcode project
        id: export
        run: bash scripts/export-ios.sh

      - name: Build unsigned generic device target
        env:
          IOS_XCODE_PROJECT: ${{ steps.export.outputs.xcode_project }}
          IOS_XCODE_SCHEME: ${{ steps.export.outputs.xcode_scheme }}
        run: bash scripts/build-ios-unsigned.sh
